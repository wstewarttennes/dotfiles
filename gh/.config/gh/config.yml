# GitHub CLI config (safe to track — auth tokens live in hosts.yml, gitignored).
# The current version of the config schema
version: 1
# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor: nvim
# When to interactively prompt. Supported values: enabled, disabled
prompt: enabled
# Preference for editor-based interactive prompting. Supported values: enabled, disabled
prefer_editor_prompt: disabled
# A pager program to send command output to, e.g. "less". Set to "cat" to disable.
pager:
# Aliases allow you to create nicknames for gh commands
aliases:
    co: pr checkout
    prc: pr create
    prv: pr view --web
    rv: pr view
# The path to a unix socket through which to send HTTP connections.
http_unix_socket:
# What web browser gh should use when opening URLs. If blank, will refer to environment.
browser:
# Whether to display labels using their RGB hex color codes. Supported values: enabled, disabled
color_labels: disabled
# Whether customizable, 4-bit accessible colors should be used. Supported values: enabled, disabled
accessible_colors: disabled
# Whether an accessible prompter should be used. Supported values: enabled, disabled
accessible_prompter: disabled
# Whether to use an animated spinner as a progress indicator. Supported values: enabled, disabled
spinner: enabled
