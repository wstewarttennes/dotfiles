unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # must stay last in the plugin list

# Persist the session tree to disk so a wedged server is a one-command restore.
# prefix + Ctrl-s saves now, prefix + Ctrl-r restores.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Deliberately NOT restoring claude processes: windows come back in the right
# directories and you start only the sessions you actually want. Auto-relaunching
# dozens of them is what made the last crash expensive.

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override catppuccin's transparent/centred message style so the command prompt
# (prefix + :) draws on an opaque, left-aligned background instead of overlapping
# the status-left text. Must come AFTER the tpm run line to win.
set -g message-style "fg=#cdd6f4,bg=#313244,align=left"
set -g message-command-style "fg=#cdd6f4,bg=#313244,align=left"

# Pane borders: thicker line style + brighter, more visible colors.
# Inactive borders use catppuccin surface gray; the active pane's border
# lights up in blue so the focused pane is obvious.
set -g pane-border-lines heavy
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"

# Label bar on top of each pane: an AI summary of the pane's last 100 lines.
# The script only spends tokens when the pane's content actually changed.
set -g pane-border-status top
set -g pane-border-format " #(~/dev/dotfiles/tmux/pane-summary.sh #{pane_id}) "
# How often tmux re-runs the border command (and status bar). The script
# no-ops for free when nothing new scrolled, so this can be brisk.
set -g status-interval 5
